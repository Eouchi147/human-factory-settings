# The render farm: every film in render/queue.json is split across GitHub's machines (its frames in interleaved parts,
# two browsers per machine), then one machine per film makes the sound and the cuts and hands them back on a branch
# render-out/<film> (each run replaces the last), with the logs of the quality checks that ran alongside. Runs on pushes to render/batch-* branches only (never main, so the site never redeploys).
name: render
on:
  push:
    branches: ['render/batch-*']
permissions:
  contents: write
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      frames: ${{ steps.m.outputs.frames }}
      films: ${{ steps.m.outputs.films }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: render/queue.json
          sparse-checkout-cone-mode: false
      - id: m
        run: |
          python3 - <<'PY'
          import json, os
          q = json.load(open('render/queue.json'))
          parts = int(q.get('parts', 10))
          fr = [dict(f, part=p, parts=parts) for f in q['films'] for p in range(parts)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as o:
              o.write('frames=' + json.dumps({'include': fr}) + '\n')
              o.write('films=' + json.dumps({'include': q['films']}) + '\n')
          PY

  frames:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.frames) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up the renderer
        run: bash render/setup.sh
      - name: Render this part of the frames
        working-directory: scripts/film
        run: |
          S=$(( ${{ matrix.part }} * 2 )); STEP=$(( ${{ matrix.parts }} * 2 ))
          N=$(python3 -c "print(int(round(${{ matrix.t1 }} * 24)))")
          R="python3 film_render.py frames --film ${{ matrix.film }} --w 1080 --h 1920 --fps 24 --t0 0 --t1 ${{ matrix.t1 }} --blur --shadow 2048"
          mkdir -p plog
          # two browsers, the second started 20 s after the first so they do not load the models at the same moment
          $R --port 8850 --start $S --step $STEP > plog/p${{ matrix.part }}-a.log 2>&1 &
          sleep 20; $R --port 8851 --start $((S + 1)) --step $STEP > plog/p${{ matrix.part }}-b.log 2>&1 &
          wait
          # any frame of this part still missing (a browser that died): render it again, one browser, up to three passes
          want() { python3 -c "import os;m=[i for k in (0,1) for i in range($S+k,$N,$STEP) if not os.path.exists('frames/f%05d.jpg'%i)];print(len(m))"; }
          for pass in 1 2 3; do
            M=$(want); echo "pass $pass: missing $M" | tee -a plog/p${{ matrix.part }}-retry.log
            [ "$M" = 0 ] && break
            $R --port $((8860 + pass)) --start $S --step $STEP >> plog/p${{ matrix.part }}-retry.log 2>&1 || true
            $R --port $((8870 + pass)) --start $((S + 1)) --step $STEP >> plog/p${{ matrix.part }}-retry.log 2>&1 || true
          done
          M=$(want); echo "frames: $(ls frames | wc -l), missing: $M"; tail -n 3 plog/*.log
          [ "$M" = 0 ] || { echo "part ${{ matrix.part }} incomplete"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.film }}-${{ matrix.part }}
          path: scripts/film/frames/
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plog-${{ matrix.film }}-${{ matrix.part }}
          path: scripts/film/plog/
          retention-days: 3

  checks:
    # the quality checks on GitHub's machines, not in Claude's workspace: bones through bones or props (audit), anything
    # that jumps between frames (jump), captions that wrap (caps); their logs ride back with the film
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.films) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up the renderer
        run: bash render/setup.sh
      - name: Check the film
        working-directory: scripts/film
        run: |
          mkdir -p qa
          (timeout 3600 python3 audit_film.py ${{ matrix.film }} --dt 0.1 --port 8811 > qa/qa_audit.log 2>&1; echo "exit $?" >> qa/qa_audit.log) &
          (timeout 3600 python3 jump_check.py ${{ matrix.film }} --port 8812 > qa/qa_jump.log 2>&1; echo "exit $?" >> qa/qa_jump.log) &
          (timeout 3600 python3 tags_check.py ${{ matrix.film }} --dt 0.1 --port 8813 > qa/qa_tags.log 2>&1; echo "exit $?" >> qa/qa_tags.log) &
          wait
          (timeout 1800 python3 caps_clear.py ${{ matrix.film }} --dt 0.1 --port 8814 > qa/qa_clear.log 2>&1; echo "exit $?" >> qa/qa_clear.log) || true
          (timeout 900 python3 check_caps.py ${{ matrix.film }} > qa/qa_caps.log 2>&1; echo "exit $?" >> qa/qa_caps.log) || true
          tail -n 5 qa/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.film }}
          path: scripts/film/qa/
          retention-days: 3

  assemble:
    needs: [plan, frames, checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.films) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up
        run: bash render/setup.sh assemble
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-${{ matrix.film }}-*
          path: scripts/film/frames${{ matrix.nn }}
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qa-${{ matrix.film }}
          path: scripts/film
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: plog-${{ matrix.film }}-*
          path: scripts/film/plog
          merge-multiple: true
      - name: Sound and cuts
        working-directory: scripts/film
        env:
          HFS_REPO: ${{ github.workspace }}
        run: |
          N=$(python3 -c "print(int(round(${{ matrix.t1 }} * 24)))")
          for f in plog/*.log; do [ -f "$f" ] && { echo "== $f"; tail -n 4 "$f"; }; done > parts.log 2>/dev/null || true
          # every frame or nothing: a film with a gap is handed back as failed, never cut short
          python3 -c "import os,sys;m=[i for i in range($N) if not os.path.exists('frames${{ matrix.nn }}/f%05d.jpg'%i)];open('missing.log','w').write('frames: %d of %d, missing %d\n%s\n'%($N-len(m),$N,len(m),m[:200]));print(open('missing.log').read());sys.exit(1 if m else 0)"
          python3 sound_${{ matrix.film }}.py ../voice/guides/${{ matrix.guide }}-voice-guide.wav ../voice/guides/${{ matrix.guide }}-report.json snd${{ matrix.nn }} > sound.log 2>&1
          python3 assemble_film.py ${{ matrix.n }} frames${{ matrix.nn }} snd${{ matrix.nn }} --mb 19 > assemble.log 2>&1
          cat assemble.log
      - name: Hand the film back
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash render/hand_back.sh "${{ matrix.film }}" "${{ github.run_number }}" "${{ job.status }}"
